<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<meta name="description" content="Track and field stopwatch with lap splits and saved races.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Track Split Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Scoreboard clock on top, two big thumb buttons, splits below; History as a second tab. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --line:#d5dbe4; --fg:#121a26; --muted:#5b6778;
  --lane:#1d4f91; --lane-ink:#ffffff; --go:#14804a; --go-ink:#ffffff; --stop:#c0332b; --stop-ink:#ffffff;
  --fast:#14804a; --slow:#b4581c; --chip:#e2e8f0;
  --display:"Barlow Condensed","sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --surface:#131c2a; --line:#24324a; --fg:#eaf0f8; --muted:#93a1b6;
  --lane:#3b78c9; --lane-ink:#ffffff; --go:#22a463; --go-ink:#04140b; --stop:#e0574e; --stop-ink:#1a0302;
  --fast:#4fd08d; --slow:#f0954f; --chip:#1c2a3e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b; --surface:#131c2a; --line:#24324a; --fg:#eaf0f8; --muted:#93a1b6;
  --lane:#3b78c9; --lane-ink:#ffffff; --go:#22a463; --go-ink:#04140b; --stop:#e0574e; --stop-ink:#1a0302;
  --fast:#4fd08d; --slow:#f0954f; --chip:#1c2a3e; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:8px 24px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:4px;gap:4px}
.tabs button{font:600 15px var(--body);letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:7px;padding:10px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
button:focus-visible,input:focus-visible{outline:3px solid var(--lane);outline-offset:2px}

.board{background:var(--lane);color:var(--lane-ink);border-radius:14px;padding:18px 16px 14px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,rgb(255 255 255 / .9) 0 22px,transparent 22px 34px)}
.board .meta{display:flex;justify-content:space-between;font:600 13px var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.clock{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(64px,22vw,112px);line-height:1;text-align:center;margin-block:10px 4px;letter-spacing:-.01em}
.clock small{font-size:.55em;opacity:.8}
.cur{text-align:center;font:500 18px var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.9;min-height:1.3em;margin-bottom:8px}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{font:700 24px var(--display);letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:14px;padding:22px 8px;cursor:pointer;touch-action:manipulation;user-select:none}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.4;cursor:default;transform:none}
.b-go{background:var(--go);color:var(--go-ink)}
.b-stop{background:var(--stop);color:var(--stop-ink)}
.b-lap{background:var(--surface);color:var(--fg);border:2px solid var(--line)}

.savebar{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.savebar label{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.savebar input{font:500 17px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--display);letter-spacing:.04em;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.row2{display:flex;gap:10px}
.btn{font:600 15px var(--body);border-radius:9px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;flex:1}
.btn.primary{background:var(--lane);color:var(--lane-ink);border-color:var(--lane)}
.btn.danger{color:var(--stop);border-color:var(--stop)}

.splits{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sh,.sr{display:grid;grid-template-columns:3.2em 1fr 1fr;padding:9px 14px;font-variant-numeric:tabular-nums;align-items:baseline}
.sh{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.sr{border-bottom:1px solid var(--line);font:600 20px var(--display)}
.sr:last-child{border-bottom:0}
.sh span:not(:first-child),.sr span:not(:first-child){text-align:right}
.sr .n{color:var(--muted);font-size:16px}
.tag{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;margin-left:6px;vertical-align:2px}
.fast .lap{color:var(--fast)} .fast .tag{color:var(--fast)}
.slow .lap{color:var(--slow)} .slow .tag{color:var(--slow)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font:600 14px var(--body);padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px)}

.race{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.race-h{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;cursor:pointer;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit}
.race-name{font:600 17px var(--body);min-width:0;overflow-wrap:anywhere}
.race-time{font:700 26px var(--display);font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.race-sub{font-size:13px;color:var(--muted)}
.race-body{border-top:1px solid var(--line)}
.race-actions{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.race-actions .btn{flex:1 1 120px}
.hist{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.big:active{transform:none}}
</style>
</head>
<body>

<div class="app">
  <div class="tabs" role="tablist">
    <button id="tab-watch" role="tab" aria-selected="true">Stopwatch</button>
    <button id="tab-hist" role="tab" aria-selected="false">Saved races</button>
  </div>

  <section id="view-watch" style="display:flex;flex-direction:column;gap:14px">
    <div class="board">
      <div class="meta"><span id="state">Ready</span><span id="lapcount">Lap 1</span></div>
      <div class="clock" id="clock">0:00<small>.00</small></div>
      <div class="cur" id="cur">&nbsp;</div>
    </div>
    <div class="controls">
      <button class="big b-lap" id="left" disabled>Split</button>
      <button class="big b-go" id="right">Start</button>
    </div>

    <div class="savebar" id="savebar" hidden>
      <label for="racename">Athlete or race name</label>
      <input id="racename" placeholder="e.g. Jordan – 800m heat 2" autocomplete="off">
      <label>Event</label>
      <div class="chips" id="events"></div>
      <div class="row2">
        <button class="btn primary" id="save">Save race</button>
      </div>
      <div class="row2" id="confirmreset" hidden>
        <button class="btn danger" id="reallyreset">Discard unsaved race</button>
        <button class="btn" id="keep">Keep it</button>
      </div>
    </div>

    <div class="splits" id="splits">
      <div class="sh"><span>Lap</span><span>Split</span><span>Total</span></div>
      <div id="splitrows"><div class="empty">Tap <b>Start</b> at the gun, then <b>Split</b> each time your runner crosses the line.</div></div>
    </div>
  </section>

  <section id="view-hist" hidden>
    <div class="hist" id="hist"></div>
    <p class="note" id="storenote"></p>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $=id=>document.getElementById(id);
const EVENTS=["100m","200m","400m","800m","1600m","3200m","Mile","4x400","XC"];
let st={running:false,startAt:0,elapsed:0,laps:[]}; // laps = cumulative ms at each split
let evt=null, races=[], openRace=null, confirmDel=null, wake=null;

function fmt(ms,big){
  ms=Math.max(0,Math.floor(ms));
  const h=Math.floor(ms/3600000), m=Math.floor(ms/60000)%60, s=Math.floor(ms/1000)%60, c=Math.floor(ms%1000/10);
  const head=(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");
  const tail="."+String(c).padStart(2,"0");
  return big?head+"<small>"+tail+"</small>":head+tail;
}
const now=()=>Date.now();
const total=()=>st.running?st.elapsed+(now()-st.startAt):st.elapsed;

function saveLocal(){try{localStorage.setItem("tst-run",JSON.stringify(st))}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem("tst-run"));if(r&&Array.isArray(r.laps))st=r}catch(e){}}

async function wakeOn(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){} wake=null}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}

function tick(){
  const t=total();
  $("clock").innerHTML=fmt(t,true);
  const last=st.laps.length?st.laps[st.laps.length-1]:0;
  $("cur").textContent=(st.laps.length&&(st.running||st.elapsed))?"Current lap "+fmt(t-last):" ";
  if(st.running)requestAnimationFrame(tick);
}

function render(){
  const started=st.running||st.elapsed>0;
  $("state").textContent=st.running?"Running":started?"Stopped":"Ready";
  $("lapcount").textContent="Lap "+(st.laps.length+1);
  const L=$("left"),R=$("right");
  if(st.running){L.textContent="Split";L.disabled=false;R.textContent="Stop";R.className="big b-stop"}
  else if(started){L.textContent="Reset";L.disabled=false;R.textContent="Resume";R.className="big b-go"}
  else{L.textContent="Split";L.disabled=true;R.textContent="Start";R.className="big b-go"}
  $("savebar").hidden=st.running||!started;
  $("splitrows").innerHTML=splitRows(st.laps,st.running?null:(started?total():null));
  tick();
}

function splitRows(laps,finish){
  // laps: cumulative split marks; finish: final time if it isn't already the last mark
  const marks=laps.slice(); if(finish!=null&&finish>(marks[marks.length-1]||0)+5)marks.push(finish);
  if(!marks.length)return '<div class="empty">Tap <b>Start</b> at the gun, then <b>Split</b> each time your runner crosses the line.</div>';
  const legs=marks.map((v,i)=>v-(i?marks[i-1]:0));
  let fi=-1,si=-1; if(legs.length>2){fi=legs.indexOf(Math.min(...legs));si=legs.indexOf(Math.max(...legs))}
  return marks.map((v,i)=>({i,v,leg:legs[i]})).reverse().map(r=>
    `<div class="sr ${r.i===fi?"fast":r.i===si?"slow":""}"><span class="n">${r.i+1}</span><span class="lap">${fmt(r.leg)}${r.i===fi?'<span class="tag">Best</span>':r.i===si?'<span class="tag">Slowest</span>':""}</span><span>${fmt(r.v)}</span></div>`).join("");
}

$("right").onclick=()=>{
  buzz();
  if(st.running){st.elapsed+=now()-st.startAt;st.running=false;wakeOff()}
  else{st.startAt=now();st.running=true;wakeOn()}
  saveLocal();render();
};
$("left").onclick=()=>{
  if(st.running){buzz();st.laps.push(total());saveLocal();render()}
  else if(st.elapsed>0){$("confirmreset").hidden=false;$("confirmreset").scrollIntoView({block:"nearest"})}
};
$("keep").onclick=()=>{$("confirmreset").hidden=true};
$("reallyreset").onclick=resetWatch;
function resetWatch(){st={running:false,startAt:0,elapsed:0,laps:[]};$("confirmreset").hidden=true;$("racename").value="";evt=null;drawEvents();saveLocal();render()}

function drawEvents(){
  $("events").innerHTML=EVENTS.map(e=>`<button class="chip" aria-pressed="${e===evt}" data-e="${e}">${e}</button>`).join("");
}
$("events").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;evt=evt===b.dataset.e?null:b.dataset.e;drawEvents()};

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

// ---------- storage: on this phone ----------
function localRaces(){try{return JSON.parse(localStorage.getItem("tst-races"))||[]}catch(e){return[]}}
function putLocalRaces(){try{localStorage.setItem("tst-races",JSON.stringify(races))}catch(e){}}

$("save").onclick=async()=>{
  const t=total(); if(t<=0)return;
  const marks=st.laps.slice(); if(t>(marks[marks.length-1]||0)+5)marks.push(t);
  const id="r"+now().toString(36);
  const race={id,name:$("racename").value.trim()||(evt?evt+" race":"Race"),event:evt||"",total:t,splits:marks,savedAt:new Date().toISOString()};
  races.unshift(race);putLocalRaces();
  toast("Race saved");resetWatch();drawHist();
};

function drawHist(){
  const h=$("hist");
  if(!races.length){h.innerHTML='<div class="race"><div class="empty">No saved races yet.<br>Time a race, stop the clock, then tap <b>Save race</b>. Each one keeps every split.</div></div>';return}
  h.innerHTML=races.map(r=>{
    const d=new Date(r.savedAt), open=openRace===r.id;
    const date=d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    const n=r.splits.length;
    return `<div class="race"><button class="race-h" data-open="${r.id}" aria-expanded="${open}">
      <span class="race-name">${esc(r.name)}</span><span class="race-time">${fmt(r.total)}</span>
      <span class="race-sub">${r.event?esc(r.event)+" · ":""}${n} split${n===1?"":"s"} · ${date}</span></button>
      ${open?`<div class="race-body"><div class="sh"><span>Lap</span><span>Split</span><span>Total</span></div>${splitRows(r.splits,null)}</div>
      <div class="race-actions">${confirmDel===r.id
        ?`<button class="btn danger" data-del="${r.id}">Delete for good</button><button class="btn" data-cancel="1">Cancel</button>`
        :`<button class="btn" data-copy="${r.id}">Copy splits</button><button class="btn danger" data-ask="${r.id}">Delete</button>`}</div>`:""}</div>`}).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

$("hist").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.open){openRace=openRace===b.dataset.open?null:b.dataset.open;confirmDel=null}
  else if(b.dataset.ask)confirmDel=b.dataset.ask;
  else if(b.dataset.cancel)confirmDel=null;
  else if(b.dataset.del){
    const id=b.dataset.del;races=races.filter(r=>r.id!==id);putLocalRaces();confirmDel=null;openRace=null;
    toast("Race deleted");
  } else if(b.dataset.copy){
    const r=races.find(x=>x.id===b.dataset.copy);
    const txt=[r.name+(r.event?" ("+r.event+")":"")+" — "+fmt(r.total)].concat(r.splits.map((v,i)=>"Lap "+(i+1)+": "+fmt(v-(i?r.splits[i-1]:0))+"  ("+fmt(v)+")")).join("\n");
    try{await navigator.clipboard.writeText(txt);toast("Splits copied")}catch(err){toast("Copy isn't allowed here")}
  }
  drawHist();
};

function showTab(w){
  $("tab-watch").setAttribute("aria-selected",w==="watch");$("tab-hist").setAttribute("aria-selected",w==="hist");
  $("view-watch").style.display=w==="watch"?"flex":"none";$("view-hist").hidden=w!=="hist";
  if(w==="hist")drawHist();
}
$("tab-watch").onclick=()=>showTab("watch");$("tab-hist").onclick=()=>showTab("hist");
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&st.running){wakeOn();tick()}});

loadLocal();races=localRaces();drawEvents();render();drawHist();
if(st.running)wakeOn();
(async()=>{try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}})();
$("storenote").textContent="Races are saved on this phone.";
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
